<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panadería Maracaibo – Tibás</title>

<style>
:root{
  --naranja:#ff8c42;
  --naranja-oscuro:#e56f1c;
  --fondo:#fff7ea;
  --card:#ffffff;
  --texto:#4a2c18;
  --muted:#6b4a2f;
  --sombra:0 10px 26px rgba(0,0,0,.12);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:var(--fondo);color:var(--texto)}

.top-bar{
  background:var(--naranja-oscuro);
  color:#fff;
  text-align:center;
  padding:10px;
}

header{
  background:#fff;
  padding:14px;
  display:flex;
  align-items:center;
  gap:10px;
  box-shadow:var(--sombra);
}

.logo-img{
  width:45px;
  height:45px;
  border-radius:50%;
}

.section{
  padding:20px;
  max-width:1100px;
  margin:auto;
}

.hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  background:linear-gradient(135deg,#ffe1c2,#ffc857);
  border-radius:15px;
  padding:15px;
}

.hero img{
  width:100%;
  border-radius:10px;
}

.filters{
  margin:15px 0;
  display:flex;
  gap:10px;
}

.filter{
  padding:8px 14px;
  border-radius:20px;
  border:none;
  background:#ddd;
  cursor:pointer;
}

.filter.active{
  background:var(--naranja);
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:var(--sombra);
  cursor:pointer;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.content{
  padding:10px;
}

.price{
  color:var(--naranja-oscuro);
  font-weight:bold;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#fff;
  display:grid;
  grid-template-columns:1fr 1fr;
  width:90%;
  max-width:800px;
}

.modal-box img{
  width:100%;
}

.close{
  position:absolute;
  top:10px;
  right:15px;
  cursor:pointer;
  font-size:20px;
}

@media(max-width:860px){
.hero,.modal-box{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="top-bar">
Panadería Maracaibo – Tibás · WhatsApp 6389-0600
</div>

<header>
<img src="./img/logo-panaderia.jpg" class="logo-img">
<div>
<strong>Panadería Maracaibo</strong><br>
<small>Menú digital</small>
</div>
</header>

<section class="section hero">
<img src="./img/hero-panaderia.jpg">
<div>
<h2>Pan fresco todos los días</h2>
<p>Repostería dulce y salada recién horneada.</p>
</div>
</section>

<section class="section">
<h2>Menú</h2>

<div class="filters">
<button class="filter active" data-cat="all">Todos</button>
<button class="filter" data-cat="panes">Panes</button>
<button class="filter" data-cat="dulce">Dulce</button>
<button class="filter" data-cat="salada">Salada</button>
</div>

<div class="grid" id="grid"></div>
</section>

<div class="modal" id="modal">
<div class="modal-box">
<span class="close" onclick="cerrar()">×</span>
<img id="mImg">
<div class="content">
<h3 id="mNombre"></h3>
<p id="mDesc"></p>
<p id="mPrecio"></p>
</div>
</div>
</div>

<script>
const productos=[
{c:"panes",n:"Baguette",d:"Pan artesanal.",p:"₡900",i:"baguette.jpg"},
{c:"dulce",n:"Prusianos",d:"Dulce tradicional.",p:"₡1200",i:"prusianos.jpg"},
{c:"salada",n:"Pastel de Carne",d:"Relleno de carne.",p:"₡2200",i:"pastel-carne.jpg"},
{c:"salada",n:"Pastel de Pollo",d:"Relleno de pollo.",p:"₡2000",i:"pastel-pollo.jpg"}
];

const grid=document.getElementById("grid");
const filtros=document.querySelectorAll(".filter");

function pintar(cat="all"){
grid.innerHTML="";
productos.filter(p=>cat==="all"||p.c===cat).forEach(p=>{
grid.innerHTML+=`
<div class="card" onclick='abrir(${JSON.stringify(p)})'>
<img src="./img/${p.i}">
<div class="content">
<strong>${p.n}</strong>
<p>${p.d}</p>
<div class="price">${p.p}</div>
</div>
</div>`;
});
}

function abrir(p){
mImg.src="./img/"+p.i;
mNombre.innerText=p.n;
mDesc.innerText=p.d;
mPrecio.innerText=p.p;
modal.style.display="flex";
}

function cerrar(){
modal.style.display="none";
}

filtros.forEach(b=>{
b.onclick=()=>{
filtros.forEach(x=>x.classList.remove("active"));
b.classList.add("active");
pintar(b.dataset.cat);
};
});

pintar();
</script>

</body>
</html>

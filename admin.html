<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Admin</title>

<link rel="stylesheet" href="static/css/admin.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

<div class="login-box">

<h1>🥐 Panel Admin</h1>

<input type="text" id="user" placeholder="Usuario">

<input type="password" id="pass" placeholder="Contraseña">

<button onclick="login()">
Ingresar
</button>

</div>

</div>

<!-- PANEL -->

<div class="admin-tabs">

<button class="tab-btn active" onclick="mostrarTab('productos')">
<span>📦</span>

Productos
</button>

<button class="tab-btn" onclick="mostrarTab('pedidos')">
<span>🛒</span>
Pedidos
</button>

<button class="tab-btn" onclick="mostrarTab('config')">
<span>⚙️</span>
Configuración
</button>

</div>
<header>

<h1>
Panel de Administración
</h1>

<button onclick="logout()">
Cerrar sesión
</button>

</header>
<div id="tab-productos">
<!-- FORM -->

<div class="admin-form">
    
<h2>
Agregar producto
</h2>

<input type="text" id="nombre" placeholder="Nombre producto">

<input type="text" id="precio" placeholder="Precio">

<textarea id="descripcion" placeholder="Descripción"></textarea>

<select id="categoria">

<option value="combos">Combos</option>
<option value="panes">Panes</option>
<option value="dulce">Dulce</option>
<option value="salada">Salada</option>

</select>

<input type="text" id="stock" placeholder="Stock">

<input type="text" id="tallas" placeholder="Tallas">

<input type="file" id="imagen">

<button onclick="guardarProducto()">
Guardar producto
</button>

</div>

<!-- PRODUCTOS -->
</h2>


</div>

</div>

<script src="static/js/admin.js"></script>
<div class="admin-container">

<!-- aquí va tu formulario actual -->
<!-- y tu lista de productos -->

</div>

<!-- PEDIDOS -->
<div id="vistaPedidos" style="display:none;">

<h2>Pedidos Recibidos</h2>

<div id="resumenPedidos"></div>

<table>
<thead>
<tr>
<th>ID</th>
<th>Cliente</th>
<th>Total</th>
<th>Estado</th>
</tr>
</thead>

<tbody id="tablaPedidos"></tbody>
</table>

</div>

<!-- CONFIG -->
<div id="vistaConfig" style="display:none;">

<h2>Configuración</h2>

<p>Aquí luego metemos banner, WhatsApp, etc.</p>

</div>

</div>
</div>
</body>
</html>

<!-- PRODUCTOS -->
<div id="tab-productos">

<!-- TU FORMULARIO -->
<!-- TU LISTA DE PRODUCTOS -->

</div>

<!-- PEDIDOS -->
<div id="tab-pedidos" style="display:none;">

<h2>Pedidos</h2>

<table>
<tbody id="tablaPedidos"></tbody>
</table>

</div>

<!-- CONFIG -->
<div id="tab-config" style="display:none;">

<h2>Configuración</h2>

</div>
